<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0D0C">
<title>Бардачок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="styles.css?v=20260823-2230">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="boot" id="boot">
  <div>
    <!-- бардачок відкривається і звідти виїжджають картки -->
    <svg class="bootart" viewBox="0 0 200 150" aria-hidden="true">
      <g class="b-card b-c3"><rect x="58" y="72" width="84" height="19" rx="6"/></g>
      <g class="b-card b-c2"><rect x="58" y="72" width="84" height="19" rx="6"/></g>
      <g class="b-card b-c1"><rect x="58" y="72" width="84" height="19" rx="6"/></g>
      <rect class="b-box" x="40" y="62" width="120" height="56" rx="15"/>
      <g class="b-lid"><rect x="40" y="90" width="120" height="28" rx="13"/>
        <rect class="b-handle" x="87" y="101" width="26" height="6" rx="3"/></g>
    </svg>
    <div class="lg">Барда<em>чок</em></div>
    <p id="bootMsg">Відкриваю ваш гараж…</p>
  </div>
</div>

<div class="app hidden" id="app">

  <header class="top">
    <div class="hi">
      <small id="topDate">—</small>
      <strong id="topName">Бардачок</strong>
    </div>
    <div class="avaWrap"><div class="ava" id="ava">—</div></div>
  </header>

  <div class="scroll" id="scroll">
    <section class="screen" id="s-tour"></section>
    <section class="screen on" id="s-home"></section>
    <section class="screen" id="s-fines"></section>
    <section class="screen" id="s-service"></section>
    <section class="screen" id="s-money"></section>
    <section class="screen" id="s-more"></section>
    <section class="screen" id="s-vin"></section>
    <section class="screen" id="s-ask"></section>
    <section class="screen" id="s-voice"></section>
    <section class="screen" id="s-rem"></section>
    <section class="screen" id="s-docs"></section>
    <section class="screen" id="s-report"></section>
    <section class="screen" id="s-crash"></section>
    <section class="screen" id="s-cars"></section>
  </div>

  <nav class="nav" id="nav">
    <button class="on" data-tab="s-home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Гараж</span>
    </button>
    <button data-tab="s-fines">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-2.3-1.6L14.4 20l-2.4-1.6L9.6 20l-2.3-1.6L5 20V4Z"/><path d="M8.5 9h7M8.5 13h4"/></svg><span>Штрафи</span>
    </button>
    <button class="mid" data-tab="s-service">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 1 0 3 3L21 6l-3-3-3.3 3.3Z"/><path d="M11.5 12.5 5 19l-2-2 6.5-6.5"/></svg><span>Сервіс</span>
    </button>
    <button data-tab="s-money">
      <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Витрати</span>
    </button>
    <button data-tab="s-more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Ще</span>
    </button>
  </nav>
</div>

<div class="sheetWrap hidden" id="sheet">
  <div class="sheetBg" data-close="1"></div>
  <div class="sheet" id="sheetBox">
    <div class="grip"></div>
    <div class="hd"><h3 id="sheetTitle">—</h3><button data-close="1" aria-label="Закрити">×</button></div>
    <div class="bd" id="sheetBody"></div>
  </div>
</div>

<script src="app.js?v=20260823-2230"></script>
</body>
</html>
